spring:
  application:
    name: journex-core-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/journex}
    username: ${SPRING_DATASOURCE_USERNAME:journex}
    password: ${SPRING_DATASOURCE_PASSWORD:journex}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

journex:
  jwt:
    # Shared HS256 secret: core-api signs, gateway verifies. At least 32 bytes.
    secret: ${JWT_SECRET:}
    ttl: PT12H
  trip:
    # How long before the scheduled departure a driver may start the ride.
    early-start: PT1H

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
