spring:
  application:
    name: journex-core-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/journex}
    username: ${SPRING_DATASOURCE_USERNAME:journex}
    password: ${SPRING_DATASOURCE_PASSWORD:journex}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A cache that is down must cost a moment, not a request.
      timeout: 1s
      connect-timeout: 1s
    mongodb:
      # The short server selection timeout keeps a MongoDB outage from stalling requests.
      uri: ${MONGO_URI:mongodb://localhost:27017/journex?serverSelectionTimeoutMS=2000}
  mvc:
    problemdetails:
      enabled: true

journex:
  jwt:
    # Shared HS256 secret: core-api signs, gateway verifies. At least 32 bytes.
    secret: ${JWT_SECRET:}
    ttl: PT12H
  cors:
    # Origins of the browser app, comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # The administrator created at startup. Leave the email empty to have none.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  intel:
    url: ${INTEL_URL:http://localhost:8000}
    # Longest core-api waits for a score before going on without one.
    timeout: PT2S
  hazard:
    # When confirmed bookings are re-scored (corridor time). "-" turns it off.
    scoring-cron: ${HAZARD_SCORING_CRON:0 0 6 * * *}
  payment:
    # The platform's fee, as a fraction of the fare, charged on top of it.
    service-fee-rate: 0.10
  pass:
    # On sale to passengers. A pass waives the service fee on bookings requested while it
    # runs. Prices are the authors' assumptions, not market research.
    offers:
      - kind: WEEKLY
        days: 7
        price: 99
      - kind: MONTHLY
        days: 30
        price: 299
      - kind: ANNUAL
        days: 365
        price: 2499
  refund:
    # A passenger cancelling a booking the driver had accepted gets this share of the
    # fare back, by how long before boarding they cancel. Later than the last tier: none.
    tiers:
      - at-least-before: PT48H
        fare-share: 1.0
      - at-least-before: PT24H
        fare-share: 0.5
  osrm:
    # The routing service. Empty means none: routes are then straight lines between stops.
    url: ${OSRM_URL:}
    timeout: PT3S
    cache-ttl: P7D
    # Only used to guess a driving time when there is no road route.
    fallback-speed-kmh: 50
  search:
    # How far, in a straight line, a passenger may be from a stop for a ride to match.
    max-access-km: 5
  pricing:
    # Per seat. Only a suggestion offered to the driver, never applied automatically.
    suggested-rupees-per-km: 2.0
  trip:
    # How long before the scheduled departure a driver may start the ride.
    early-start: PT1H
  booking:
    # A request the driver has not answered is closed, and everything returned, once it
    # is this old, or once boarding is this near, whichever comes first.
    answer-within: PT12H
    close-before-boarding: PT2H
    # How often unanswered requests are looked for. "-" turns it off.
    expiry-cron: ${BOOKING_EXPIRY_CRON:0 */5 * * * *}
  rating:
    # A trip nobody has rated gets one reminder this long after it is completed.
    remind-after: PT24H
    reminder-cron: ${RATING_REMINDER_CRON:0 0 * * * *}
  hold:
    # How long seats a passenger asked to hold are kept from other passengers.
    ttl: PT5M
  verification:
    # One-time codes proving an email address or a phone number.
    code-ttl: PT10M
    resend-after: PT1M
    max-attempts: 5
  sos:
    # Pressing the emergency button again within this long repeats nothing.
    repeat-window: PT1M

server:
  port: 8080

management:
  health:
    redis:
      # Only a cache: core-api is healthy without it.
      enabled: false
    mongo:
      # Notifications are a courtesy; core-api is healthy without them.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
