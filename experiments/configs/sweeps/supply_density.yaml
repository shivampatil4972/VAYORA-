# Does asking bookings to reconfirm pay when seats are scarcer or more plentiful?
# A released seat is only worth something if somebody is waiting to take it, so the
# value of an early release should depend on how supply compares with demand.
#
# Supply changes the baseline as well as the variant, so each cell gets its own.
#
# The model (h2) was trained at 12 rides a day. At 6 and 20 it is being used outside
# the world it learnt from, which is itself part of what this sweep shows.
name: supply-density
baseline: variants/B3.yaml
variant: variants/B4.yaml
baseline_per_cell: true
parameters:
  supply.rides_per_day: [6, 12, 20]
