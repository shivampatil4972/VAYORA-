server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Text compresses to a fraction; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"web"}';
    }

    # Built files carry a hash of their content in the name, so they never change:
    # a browser keeps them for a year. Security headers are repeated in each location,
    # because nginx drops the server's once a location adds its own.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static files only. This server never proxies to another service. The page itself is
    # checked on every visit, so a new release reaches readers at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        try_files $uri $uri/ /index.html;
    }
}
