server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"web"}';
    }

    # Static files only. This server never proxies to another service.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
